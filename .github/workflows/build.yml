name: Build Config Editor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (arm64)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'arm64'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS arm64 app
        run: |
          python ConfigEditor/build.py --platform macos

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: "dist/PicoSignals Config Editor.app"

  build-macos-x86:
    name: macOS (x86_64 via Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta available
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Set up Python (x86)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install PyInstaller (x86)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build macOS x86 app (Rosetta)
        run: |
          python ConfigEditor/build.py --platform macos --arch x86_64

      - name: Upload macOS x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86-app
          path: "dist/PicoSignals Config Editor.app"

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows exe
        run: |
          python ConfigEditor/build.py --platform windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/config_editor/config_editor.exe
