name: Build OTAUpdater

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r OTAupdater/requirements.txt
          pip install pillow

      - name: Build app
        working-directory: OTAupdater
        run: |
          # ensure icons exist
          python generate_icons.py || true
          # clean previous output to avoid PyInstaller interactive prompt
          if [ -d "dist/OTAUpdater.app" ]; then rm -rf dist/OTAUpdater.app; fi
          pyinstaller -y --clean ota_macos.spec

      - name: Zip .app preserving metadata
        working-directory: OTAupdater
        run: |
          APPNAME="dist/OTAUpdater.app"
          ZIPNAME="OTAUpdater-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APPNAME" "$ZIPNAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-macos-${{ matrix.arch }}
          path: OTAupdater/OTAUpdater-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r OTAupdater/requirements.txt

      - name: Build exe
        working-directory: OTAupdater
        run: |
          pyinstaller ota_windows.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-windows
          path: OTAupdater/dist/ota_updater/ota_updater.exe
